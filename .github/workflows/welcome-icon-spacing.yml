name: Welcome icon and spacing update
on:
  push:
    paths:
      - '.welcome-icon-spacing-trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update welcome icon and spacing
        shell: bash
        run: |
          python - <<'PY2'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          old_css = '.welcome-note{font-size:16px;font-weight:500;color:var(--muted2);margin-top:4px}.welcome-bottom-rule{margin:0 0 14px}.welcome-bottom-meta{margin-bottom:18px}.welcome h1,.welcome h2{max-width:none}.welcome h1{font-size:52px}.welcome h2{font-size:50px}.punchline{display:inline}.welcome-watermark{position:absolute;right:-114px;bottom:-6px;width:390px;height:390px;color:var(--accent);opacity:.09;transform:rotate(-12deg);pointer-events:none;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}.spacer{flex:1;min-height:28px}@media(max-width:390px){.welcome h1{font-size:48px}.welcome h2{font-size:46px}.welcome-watermark{right:-106px;bottom:-2px;width:360px;height:360px}}'
          new_css = '.welcome-note{font-size:16px;font-weight:500;color:var(--muted2);margin-top:4px}.welcome-bottom-rule{margin:0 0 10px}.welcome-bottom-meta{margin-bottom:16px}.welcome-spacer{flex:.58;min-height:10px}.welcome h1,.welcome h2{max-width:none}.welcome h1{font-size:52px}.welcome h2{font-size:50px}.punchline{display:inline}.welcome-watermark{position:absolute;right:-122px;bottom:60px;width:400px;height:400px;color:var(--accent);opacity:.09;transform:rotate(-10deg);pointer-events:none;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}.spacer{flex:1;min-height:28px}@media(max-width:390px){.welcome h1{font-size:48px}.welcome h2{font-size:46px}.welcome-watermark{right:-110px;bottom:70px;width:366px;height:366px}.welcome-spacer{flex:.5;min-height:8px}}'
          if old_css not in s:
              raise SystemExit('Old welcome CSS block not found')
          s = s.replace(old_css, new_css, 1)

          old_welcome = 'function welcome(){return `<section class="screen welcome"><svg class="welcome-watermark" viewBox="0 0 120 120" aria-hidden="true"><g transform="rotate(-8 60 60)"><circle cx="54" cy="58" r="38"/><path d="M31 45l9 7-9 7"/><path d="M72 45l-9 7 9 7"/><path d="M35 64c11 7 29 8 42 1-4 13-13 20-22 20-10 0-17-8-20-21Z"/><path d="M22 55c-3 4-4 7-4 9a5 5 0 0 0 10 0c0-2-2-5-6-9Z"/><path d="M86 53c-3 4-4 7-4 9a5 5 0 0 0 10 0c0-2-2-5-6-9Z"/><path d="M94 31l9-8M99 44l13-1M90 21l3-12"/></g></svg><h1>memories<br>with<br>friends:<br><span class="accent punchline">priceless.</span></h1><h2>dinner:<br><span class="accent punchline">unfortunately<br>not.</span></h2><div class="spacer"></div><div class="rule welcome-bottom-rule"></div><div class="welcome-bottom-meta"><div class="eyebrow">AMS LEO DINNER TALLY</div><div class="welcome-note">sorry it took so long.</div></div><button class="primary" data-action="start"><span>let\'s go</span><span>→</span></button></section>`}'
          new_welcome = 'function welcome(){return `<section class="screen welcome"><svg class="welcome-watermark" viewBox="0 0 160 120" aria-hidden="true"><g><circle cx="63" cy="47" r="30"/><path d="M48 39l8 7-8 7"/><path d="M78 34l-7 8h12"/><path d="M43 60l10-8 11 1 9 6 11 0"/><path d="M62 56c4 3 7 7 8 11"/><circle cx="101" cy="76" r="27"/><path d="M88 68l8 6-8 6"/><path d="M114 68l-8 6 8 6"/><path d="M82 81c7 9 28 11 39 2"/><path d="M87 80l3 10M95 79l1 11M103 79v11M111 78l-1 11M119 77l-3 10"/></g></svg><h1>memories<br>with friends:<br><span class="accent punchline">priceless.</span></h1><h2>dinner:<br><span class="accent punchline">unfortunately<br>not.</span></h2><div class="spacer welcome-spacer"></div><div class="rule welcome-bottom-rule"></div><div class="welcome-bottom-meta"><div class="eyebrow">AMS LEO DINNER TALLY</div><div class="welcome-note">sorry it took so long.</div></div><button class="primary" data-action="start"><span>let\'s go</span><span>→</span></button></section>`}'
          if old_welcome not in s:
              raise SystemExit('Old welcome function not found')
          s = s.replace(old_welcome, new_welcome, 1)
          p.write_text(s)
          PY2
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update welcome icon and spacing"
          git push
