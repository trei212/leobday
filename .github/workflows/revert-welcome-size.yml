name: Revert welcome title size
on:
  push:
    paths:
      - '.revert-welcome-size-trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original welcome title sizes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '.welcome h1,.welcome h2{max-width:none;font-size:clamp(34px,9.25vw,42px)}'
          new = '.welcome h1,.welcome h2{max-width:none}.welcome h1{font-size:52px}.welcome h2{font-size:50px}'
          if old not in s:
              raise SystemExit('Expected unified welcome sizing CSS not found')
          s = s.replace(old, new, 1)
          old_media = '@media(max-width:390px){.welcome-watermark{right:-106px;bottom:-2px;width:360px;height:360px}}'
          new_media = '@media(max-width:390px){.welcome h1{font-size:48px}.welcome h2{font-size:46px}.welcome-watermark{right:-106px;bottom:-2px;width:360px;height:360px}}'
          if old_media not in s:
              raise SystemExit('Expected mobile welcome CSS not found')
          s = s.replace(old_media, new_media, 1)
          p.write_text(s)
          PY
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Restore original welcome title sizes"
          git push
