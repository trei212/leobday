name: Use exact welcome emoji
on:
  push:
    paths:
      - '.exact-emoji-trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write exact emoji asset and update welcome
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html')
          s=p.read_text()

          old_css='.welcome-watermark{position:absolute;right:-8px;bottom:50px;width:210px;height:210px;color:var(--accent);opacity:.09;transform:rotate(-5deg);pointer-events:none;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}'
          new_css='.welcome-watermark{position:absolute;right:0;top:320px;width:217px;height:auto;opacity:1;pointer-events:none;display:block}'
          if old_css not in s:
              raise SystemExit('expected current emoji css not found')
          s=s.replace(old_css,new_css,1)

          old_media='.welcome-watermark{right:-10px;bottom:52px;width:200px;height:200px}'
          new_media='.welcome-watermark{right:0;top:292px;width:200px;height:auto}'
          if old_media not in s:
              raise SystemExit('expected current mobile emoji css not found')
          s=s.replace(old_media,new_media,1)

          old_svg='<svg class="welcome-watermark" viewBox="0 0 120 120" aria-hidden="true"><g><circle cx="60" cy="60" r="45"/><path d="M38 43l14 11-14 3"/><path d="M84 44L70 54l14 10"/><path d="M29 68L92 84c-5 17-17 26-32 27-16 0-29-8-35-20-4-9-3-18 4-23Z"/></g></svg>'
          new_img='<img class="welcome-watermark" src="emoji-reference.png" alt="" aria-hidden="true">'
          if old_svg not in s:
              raise SystemExit('expected current emoji svg not found')
          s=s.replace(old_svg,new_img,1)
          p.write_text(s)

          data=base64.b64decode('''...?''' )
          Path('emoji-reference.png').write_bytes(data)
          PY
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html emoji-reference.png
          git diff --cached --quiet || git commit -m "Use exact welcome emoji reference"
          git push
