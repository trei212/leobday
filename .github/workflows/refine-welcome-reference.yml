name: Refine welcome reference
on:
  push:
    paths:
      - '.refine-welcome-reference-trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine welcome to reference
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          old_css = '.screen{flex:1;display:flex;flex-direction:column;padding:28px 24px;animation:fadeUp 320ms both}.screen.welcome{padding:32px 24px 8px;animation-duration:420ms;position:relative}.eyebrow{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2)}.rule{height:2px;background:var(--ink);margin:22px 0 34px;animation:ruleIn 600ms 180ms both;transform-origin:left}h1{font-size:clamp(38px,12vw,52px);line-height:.98;letter-spacing:-.035em;font-weight:800;margin:0;max-width:9ch}.welcome h2{font-size:clamp(34px,11vw,48px);line-height:.98;letter-spacing:-.035em;font-weight:800;margin:44px 0 0;max-width:10ch}.accent{color:var(--accent)}.welcome-note{font-size:16px;font-weight:500;color:var(--muted2);margin-top:4px}.welcome-bottom-rule{width:44%;margin:38px 0 14px}.welcome-bottom-meta{margin-bottom:0}.welcome-spacer{flex:1;min-height:28px}.welcome h1,.welcome h2{max-width:none}.welcome h1{font-size:52px}.welcome h2{font-size:50px;margin-top:46px}.punchline{display:inline}.welcome-watermark{position:absolute;right:-55px;bottom:14px;width:298px;height:298px;color:var(--accent);opacity:.09;transform:rotate(-5deg);pointer-events:none;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}.spacer{flex:1;min-height:28px}@media(max-width:390px){.welcome h1{font-size:48px}.welcome h2{font-size:46px}.welcome-watermark{right:-50px;bottom:16px;width:280px;height:280px}.welcome-spacer{flex:1;min-height:24px}.welcome-bottom-rule{width:44%}}'
          new_css = '.screen{flex:1;display:flex;flex-direction:column;padding:28px 24px;animation:fadeUp 320ms both}.screen.welcome{padding:44px 24px 8px;animation-duration:420ms;position:relative}.eyebrow{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2)}.rule{height:2px;background:var(--ink);margin:22px 0 34px;animation:ruleIn 600ms 180ms both;transform-origin:left}h1{font-size:clamp(38px,12vw,52px);line-height:.98;letter-spacing:-.035em;font-weight:800;margin:0;max-width:9ch}.welcome h2{font-size:clamp(34px,11vw,48px);line-height:.98;letter-spacing:-.035em;font-weight:800;margin:44px 0 0;max-width:10ch}.accent{color:var(--accent)}.welcome-note{font-size:16px;font-weight:500;color:var(--muted2);margin-top:4px}.welcome-bottom-rule{width:44%;margin:38px 0 14px}.welcome-bottom-meta{margin-bottom:0}.welcome-spacer{flex:1;min-height:28px}.welcome h1,.welcome h2{max-width:none}.welcome h1{font-size:52px}.welcome h2{font-size:50px;margin-top:46px}.punchline{display:inline}.welcome-watermark{position:absolute;right:-8px;bottom:50px;width:210px;height:210px;color:var(--accent);opacity:.09;transform:rotate(-5deg);pointer-events:none;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}.spacer{flex:1;min-height:28px}@media(max-width:390px){.welcome h1{font-size:48px}.welcome h2{font-size:46px}.welcome-watermark{right:-10px;bottom:52px;width:200px;height:200px}.welcome-spacer{flex:1;min-height:24px}.welcome-bottom-rule{width:44%}}'
          if old_css not in s:
              raise SystemExit('expected current welcome css not found')
          s = s.replace(old_css, new_css, 1)

          old_svg = '<svg class="welcome-watermark" viewBox="0 0 120 120" aria-hidden="true"><g><circle cx="60" cy="60" r="43"/><path d="M35 45l13 9-13 9"/><path d="M85 45l-13 9 13 9"/><path d="M31 69c8 22 25 31 29 31s21-9 29-31c-9 4-19 6-29 6s-20-2-29-6Z"/></g></svg>'
          new_svg = '<svg class="welcome-watermark" viewBox="0 0 120 120" aria-hidden="true"><g><circle cx="60" cy="60" r="45"/><path d="M38 43l14 11-14 3"/><path d="M84 44L70 54l14 10"/><path d="M29 68L92 84c-5 17-17 26-32 27-16 0-29-8-35-20-4-9-3-18 4-23Z"/></g></svg>'
          if old_svg not in s:
              raise SystemExit('expected current welcome svg not found')
          s = s.replace(old_svg, new_svg, 1)

          p.write_text(s)
          PY
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refine welcome spacing and emoji"
          git push
