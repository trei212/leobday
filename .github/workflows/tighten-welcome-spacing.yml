name: Tighten welcome spacing
on:
  push:
    paths:
      - '.tighten-welcome-spacing-trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten welcome spacing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = [
              ('.rule{height:2px;background:var(--ink);margin:22px 0 42px;', '.rule{height:2px;background:var(--ink);margin:22px 0 34px;'),
              ('.welcome h2{font-size:clamp(34px,11vw,48px);line-height:.98;letter-spacing:-.035em;font-weight:800;margin:58px 0 0;', '.welcome h2{font-size:clamp(34px,11vw,48px);line-height:.98;letter-spacing:-.035em;font-weight:800;margin:44px 0 0;'),
              ('.welcome-note{font-size:16px;font-weight:500;color:var(--muted2);margin-top:7px}', '.welcome-note{font-size:16px;font-weight:500;color:var(--muted2);margin-top:4px}')
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Tighten welcome spacing"
          git push
