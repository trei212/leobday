name: Move welcome meta bottom
on:
  push:
    paths:
      - '.move-welcome-meta-bottom-trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move welcome meta to bottom
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_css = '.welcome-note{font-size:16px;font-weight:500;color:var(--muted2);margin-top:4px}.welcome h1,.welcome h2{max-width:none}'
          new_css = '.welcome-note{font-size:16px;font-weight:500;color:var(--muted2);margin-top:4px}.welcome-bottom-rule{margin:0 0 14px}.welcome-bottom-meta{margin-bottom:18px}.welcome h1,.welcome h2{max-width:none}'
          if old_css not in s:
              raise SystemExit('Missing expected welcome CSS')
          s = s.replace(old_css, new_css, 1)
          old = '<svg class="welcome-watermark" viewBox="0 0 120 120" aria-hidden="true"><g transform="rotate(-8 60 60)"><circle cx="54" cy="58" r="38"/><path d="M31 45l9 7-9 7"/><path d="M72 45l-9 7 9 7"/><path d="M35 64c11 7 29 8 42 1-4 13-13 20-22 20-10 0-17-8-20-21Z"/><path d="M22 55c-3 4-4 7-4 9a5 5 0 0 0 10 0c0-2-2-5-6-9Z"/><path d="M86 53c-3 4-4 7-4 9a5 5 0 0 0 10 0c0-2-2-5-6-9Z"/><path d="M94 31l9-8M99 44l13-1M90 21l3-12"/></g></svg><div class="eyebrow">AMS LEO DINNER TALLY</div><div class="welcome-note">sorry it took so long.</div><div class="rule"></div><h1>memories<br>with<br>friends:<br><span class="accent punchline">priceless.</span></h1><h2>dinner:<br><span class="accent punchline">unfortunately<br>not.</span></h2><div class="spacer"></div><button class="primary" data-action="start"><span>let\'s go</span><span>→</span></button>'
          new = '<svg class="welcome-watermark" viewBox="0 0 120 120" aria-hidden="true"><g transform="rotate(-8 60 60)"><circle cx="54" cy="58" r="38"/><path d="M31 45l9 7-9 7"/><path d="M72 45l-9 7 9 7"/><path d="M35 64c11 7 29 8 42 1-4 13-13 20-22 20-10 0-17-8-20-21Z"/><path d="M22 55c-3 4-4 7-4 9a5 5 0 0 0 10 0c0-2-2-5-6-9Z"/><path d="M86 53c-3 4-4 7-4 9a5 5 0 0 0 10 0c0-2-2-5-6-9Z"/><path d="M94 31l9-8M99 44l13-1M90 21l3-12"/></g></svg><h1>memories<br>with<br>friends:<br><span class="accent punchline">priceless.</span></h1><h2>dinner:<br><span class="accent punchline">unfortunately<br>not.</span></h2><div class="spacer"></div><div class="rule welcome-bottom-rule"></div><div class="welcome-bottom-meta"><div class="eyebrow">AMS LEO DINNER TALLY</div><div class="welcome-note">sorry it took so long.</div></div><button class="primary" data-action="start"><span>let\'s go</span><span>→</span></button>'
          if old not in s:
              raise SystemExit('Missing expected current welcome markup')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Move welcome meta to bottom"
          git push
