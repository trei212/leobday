name: Make watermark crying laughing
on:
  push:
    paths:
      - '.crying-laughing-trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make tears explicit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<svg class="welcome-watermark" viewBox="0 0 120 120" aria-hidden="true"><g transform="rotate(-8 60 60)"><circle cx="54" cy="58" r="38"/><path d="M34 49c6-8 12-8 17 0"/><path d="M58 47c6-8 12-8 17 0"/><path d="M33 62c8 23 36 27 51 4-16 8-34 8-51-4Z"/><path d="M40 76c10 6 24 6 34 0"/><path d="M23 50c-5 7-6 14-3 21"/><path d="M27 52c-6 3-9 8-10 14"/><path d="M79 48c4 6 6 12 5 18"/><path d="M83 51c5 3 8 8 9 14"/><path d="M94 31l9-8M99 44l13-1M90 21l3-12"/></g></svg>'
          new = '<svg class="welcome-watermark" viewBox="0 0 120 120" aria-hidden="true"><g transform="rotate(-8 60 60)"><circle cx="54" cy="58" r="38"/><path d="M34 48c6-9 12-9 18 0"/><path d="M58 46c6-9 12-9 18 0"/><path d="M33 61c8 24 36 29 52 4-17 8-35 8-52-4Z"/><path d="M40 76c10 6 24 6 34 0"/><path d="M31 51c-4 3-7 5-10 6"/><path d="M77 49c4 2 7 4 10 6"/><path d="M24 53c-5 7-7 11-7 15a8 8 0 0 0 16 0c0-4-3-9-9-15Z" fill="currentColor" stroke="none"/><path d="M84 51c-5 7-7 11-7 15a8 8 0 0 0 16 0c0-4-3-9-9-15Z" fill="currentColor" stroke="none"/><path d="M94 31l9-8M99 44l13-1M90 21l3-12"/></g></svg>'
          if old not in s:
              raise SystemExit('Missing expected current watermark SVG')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Make laugh watermark visibly crying"
          git push
