name: Tweak welcome title and payment name
on:
  push:
    paths:
      - '.ui-tweak-trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = [
              ('.welcome h2{font-size:50px}', '.welcome h2{font-size:clamp(34px,9vw,42px)}'),
              ('@media(max-width:390px){.welcome h1{font-size:48px}.welcome h2{font-size:46px}.welcome-watermark', '@media(max-width:390px){.welcome h1{font-size:48px}.welcome-watermark'),
              ('<span class="accent punchline">unfortunately<br>not.</span>', '<span class="accent punchline">unfortunately not.</span>'),
              ('.instruction-copy strong{font-size:17px;font-weight:800;color:var(--accent)}', '.instruction-copy strong{font-size:inherit;font-weight:inherit;color:var(--accent)}')
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old}')
              s = s.replace(old, new, 1)
          marker = '.punchline{display:inline}'
          if '.welcome h2 .punchline{white-space:nowrap}' not in s:
              if marker not in s:
                  raise SystemExit('Missing punchline CSS')
              s = s.replace(marker, marker + '.welcome h2 .punchline{white-space:nowrap}', 1)
          p.write_text(s)
          PY
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Keep welcome punchline on one line"
          git push
