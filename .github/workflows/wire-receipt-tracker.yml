name: Wire receipt tracker
on:
  push:
    paths:
      - '.tracker-trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          url = 'https://script.google.com/macros/s/AKfycbxbYvWiXksc5gD0KsJv6NA21AAGYwbLP5ZYojy6L0mS9l27LPl0fP0B-pK0QekBNBdr_w/exec'
          if 'const TRACKER_URL=' not in s:
              needle = 'const state={step:"welcome",query:"",dupeKey:null,guest:null,wine:null,copied:false};'
              s = s.replace(needle, f'const TRACKER_URL="{url}";\n' + needle, 1)
          if 'function trackReceiptView()' not in s:
              fn = 'function trackReceiptView(){const g=state.guest;if(!g)return;const key=`leo-receipt-view:${g.id}`;try{if(sessionStorage.getItem(key))return}catch(_){}const payload={guestId:String(g.id),name:g.name,city:g.city,event:"receipt_view"};fetch(TRACKER_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(payload),keepalive:true}).then(()=>{try{sessionStorage.setItem(key,"1")}catch(_){}}).catch(()=>{})}\n'
              s = s.replace('function back(){', fn + 'function back(){', 1)
          old = 'else if(a==="toReceipt"&&state.wine!==null)state.step="receipt";'
          new = 'else if(a==="toReceipt"&&state.wine!==null){state.step="receipt";trackReceiptView()};'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Could not locate receipt transition')
          p.write_text(s)
          PY
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Wire receipt view tracker"
          git push
