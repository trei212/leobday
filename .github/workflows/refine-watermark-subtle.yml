name: Refine watermark subtle
on:
  push:
    paths:
      - '.refine-watermark-subtle-trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine watermark
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<svg class="welcome-watermark" viewBox="0 0 120 120" aria-hidden="true"><g transform="rotate(-8 60 60)"><circle cx="54" cy="58" r="38"/><path d="M34 48c6-9 12-9 18 0"/><path d="M58 46c6-9 12-9 18 0"/><path d="M33 61c8 24 36 29 52 4-17 8-35 8-52-4Z"/><path d="M40 76c10 6 24 6 34 0"/><path d="M31 51c-4 3-7 5-10 6"/><path d="M77 49c4 2 7 4 10 6"/><path d="M24 53c-5 7-7 11-7 15a8 8 0 0 0 16 0c0-4-3-9-9-15Z" fill="currentColor" stroke="none"/><path d="M84 51c-5 7-7 11-7 15a8 8 0 0 0 16 0c0-4-3-9-9-15Z" fill="currentColor" stroke="none"/><path d="M94 31l9-8M99 44l13-1M90 21l3-12"/></g></svg>'
          new = '<svg class="welcome-watermark" viewBox="0 0 120 120" aria-hidden="true"><g transform="rotate(-8 60 60)"><circle cx="54" cy="58" r="38"/><path d="M31 45l9 7-9 7"/><path d="M72 45l-9 7 9 7"/><path d="M35 64c11 7 29 8 42 1-4 13-13 20-22 20-10 0-17-8-20-21Z"/><path d="M22 55c-3 4-4 7-4 9a5 5 0 0 0 10 0c0-2-2-5-6-9Z"/><path d="M86 53c-3 4-4 7-4 9a5 5 0 0 0 10 0c0-2-2-5-6-9Z"/><path d="M94 31l9-8M99 44l13-1M90 21l3-12"/></g></svg>'
          if old not in s:
              raise SystemExit('Missing expected current watermark SVG')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refine laugh watermark"
          git push
