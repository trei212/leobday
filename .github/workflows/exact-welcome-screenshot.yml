name: Exact welcome screenshot sync
on:
  push:
    paths:
      - '.exact-welcome-screenshot-trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match welcome screen to approved screenshot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()

          old_css = '.welcome-note{font-size:16px;font-weight:500;color:var(--muted2);margin-top:4px}.welcome-bottom-rule{margin:0 0 10px}.welcome-bottom-meta{margin-bottom:16px}.welcome-spacer{flex:.58;min-height:10px}.welcome h1,.welcome h2{max-width:none}.welcome h1{font-size:52px}.welcome h2{font-size:50px}.punchline{display:inline}.welcome-watermark{position:absolute;right:-86px;bottom:16px;width:365px;height:365px;color:var(--accent);opacity:.09;transform:rotate(-5deg);pointer-events:none;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}.spacer{flex:1;min-height:28px}@media(max-width:390px){.welcome h1{font-size:48px}.welcome h2{font-size:46px}.welcome-watermark{right:-78px;bottom:20px;width:338px;height:338px}.welcome-spacer{flex:.5;min-height:8px}}'
          new_css = '.welcome-note{font-size:16px;font-weight:500;color:var(--muted2);margin-top:4px}.welcome-bottom-rule{width:46%;margin:0 0 12px}.welcome-bottom-meta{margin-bottom:18px}.welcome-spacer{flex:.62;min-height:14px}.welcome h1,.welcome h2{max-width:none}.welcome h1{font-size:52px}.welcome h2{font-size:50px}.punchline{display:inline}.welcome-watermark{position:absolute;right:-88px;bottom:18px;width:366px;height:366px;color:var(--accent);opacity:.09;transform:rotate(-5deg);pointer-events:none;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}.spacer{flex:1;min-height:28px}@media(max-width:390px){.welcome h1{font-size:48px}.welcome h2{font-size:46px}.welcome-watermark{right:-80px;bottom:20px;width:338px;height:338px}.welcome-spacer{flex:.58;min-height:10px}}'
          if old_css not in s:
              raise SystemExit('Expected current welcome CSS block not found')
          s = s.replace(old_css, new_css, 1)

          new_welcome = 'function welcome(){return `<section class="screen welcome"><svg class="welcome-watermark" viewBox="0 0 120 120" aria-hidden="true"><g><circle cx="60" cy="60" r="43"/><path d="M34 43l13 10-13 10"/><path d="M86 43l-13 10 13 10"/><path d="M31 69c8 22 25 31 29 31s21-9 29-31c-9 4-19 6-29 6s-20-2-29-6Z"/></g></svg><h1>memories<br>with friends:<br><span class="accent punchline">priceless</span></h1><h2>dinner:<br><span class="accent punchline">unfortunately<br>not</span></h2><div class="spacer welcome-spacer"></div><div class="rule welcome-bottom-rule"></div><div class="welcome-bottom-meta"><div class="eyebrow">AMS LEO DINNER TALLY</div><div class="welcome-note">sorry it took so long.</div></div><button class="primary" data-action="start"><span>let\'s go</span><span>→</span></button></section>`}'
          s = re.sub(r'function welcome\(\)\{return `.*?`\}\nfunction uniqueKeys\(\)', new_welcome + '\nfunction uniqueKeys()', s, count=1, flags=re.S)
          p.write_text(s)
          PY
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Match approved welcome screenshot"
          git push
