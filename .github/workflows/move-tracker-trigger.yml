name: Move tracker trigger
on:
  push:
    paths:
      - '.tracker-move-trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update tracker trigger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_fn = 'function trackReceiptView(){const g=state.guest;if(!g)return;const key=`leo-receipt-view:${g.id}`;try{if(sessionStorage.getItem(key))return}catch(_){}const payload={guestId:String(g.id),name:g.name,city:g.city,event:"receipt_view"};fetch(TRACKER_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(payload),keepalive:true}).then(()=>{try{sessionStorage.setItem(key,"1")}catch(_){}}).catch(()=>{})}'
          new_fn = 'function trackFinalForward(){const g=state.guest;if(!g)return;const key=`leo-final-forward:${g.id}`;try{if(sessionStorage.getItem(key))return}catch(_){}const payload={guestId:String(g.id),name:g.name,city:g.city,event:"final_forward"};fetch(TRACKER_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(payload),keepalive:true}).then(()=>{try{sessionStorage.setItem(key,"1")}catch(_){}}).catch(()=>{})}'
          if old_fn in s:
              s = s.replace(old_fn, new_fn, 1)
          elif 'function trackFinalForward()' not in s:
              raise SystemExit('Could not locate tracker function')
          old_receipt = 'else if(a==="toReceipt"&&state.wine!==null){state.step="receipt";trackReceiptView()};'
          new_receipt = 'else if(a==="toReceipt"&&state.wine!==null)state.step="receipt";'
          if old_receipt in s:
              s = s.replace(old_receipt, new_receipt, 1)
          elif new_receipt not in s:
              raise SystemExit('Could not locate receipt transition')
          old_done = 'else if(a==="done")state.step="done";'
          new_done = 'else if(a==="done"){trackFinalForward();state.step="done"};'
          if old_done in s:
              s = s.replace(old_done, new_done, 1)
          elif new_done not in s:
              raise SystemExit('Could not locate final forward transition')
          p.write_text(s)
          PY
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Move tracker to final forward button"
          git push
