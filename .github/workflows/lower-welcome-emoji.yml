name: Lower welcome emoji
on:
  push:
    paths:
      - '.lower-welcome-emoji-trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lower emoji toward CTA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='.welcome-watermark{position:absolute;right:0;top:320px;width:217px;height:212.5px;pointer-events:none;display:block}'
          new='.welcome-watermark{position:absolute;right:0;bottom:54px;width:217px;height:212.5px;pointer-events:none;display:block}'
          if old not in s: raise SystemExit('desktop emoji css not found')
          s=s.replace(old,new,1)
          oldm='.welcome-watermark{right:0;top:292px;width:200px;height:195.9px}'
          newm='.welcome-watermark{right:0;bottom:56px;width:200px;height:195.9px}'
          if oldm not in s: raise SystemExit('mobile emoji css not found')
          s=s.replace(oldm,newm,1)
          p.write_text(s)
          PY
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Lower welcome emoji toward CTA"
          git pull --rebase origin main
          git push
