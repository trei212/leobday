<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f2f2">
<title>AMS Leo Dinner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f2f2;--ink:#201e1d;--accent:#ec3013;--muted:#605d5d;--muted2:#7d7979;--line:#d7d3d3;--hover:#eae7e7}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);font-family:"Archivo",system-ui,sans-serif;color:var(--ink)}button,input{font:inherit;color:inherit}button{border-radius:0}button:focus-visible,input:focus-visible{outline:3px solid rgba(236,48,19,.28);outline-offset:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes ruleIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.shell{min-height:100svh;display:flex;justify-content:center;background:var(--ink)}.app{width:100%;max-width:460px;min-height:100svh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}.progress{padding:20px 24px 0;display:flex;flex-direction:column;gap:8px;flex:0 0 auto}.progress-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.progress-label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.brand{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2)}.progress-track{height:2px;background:var(--line);position:relative}.progress-fill{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width 340ms cubic-bezier(.2,.7,.3,1)}
.screen{flex:1;display:flex;flex-direction:column;padding:28px 24px;animation:fadeUp 320ms both}.screen.welcome{padding:32px 24px 28px;animation-duration:420ms}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2)}.rule{height:2px;background:var(--ink);margin:22px 0 26px;animation:ruleIn 600ms 180ms both;transform-origin:left}h1{font-size:clamp(38px,12vw,52px);line-height:.98;letter-spacing:-.035em;font-weight:800;margin:0;max-width:9ch}.welcome h2{font-size:clamp(34px,11vw,48px);line-height:.98;letter-spacing:-.035em;font-weight:800;margin:28px 0 0;max-width:10ch}.accent{color:var(--accent)}.spacer{flex:1;min-height:28px}
.primary{width:100%;background:var(--accent);color:var(--bg);border:0;padding:18px 20px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:flex-end;gap:8px;cursor:pointer;transition:background 160ms;text-align:right}.primary:hover{background:#dd2b0f}.primary:active{background:#ae1800}.primary:disabled{cursor:default}.primary.center{justify-content:center;text-align:center}.back{flex:0 0 auto;background:transparent;border:0;padding:10px 0;font-size:28px;font-weight:500;cursor:pointer;text-align:left;align-self:flex-start}.bottom-row{display:flex;align-items:stretch;gap:10px}.bottom-row .back{width:36px;display:flex;align-items:center;justify-content:flex-start}.page-title{font-size:38px;line-height:1;letter-spacing:-.03em;font-weight:800;margin:0;text-transform:uppercase}.subcopy{font-size:15px;color:var(--muted);margin:10px 0 0}.searchbox{display:flex;align-items:center;gap:10px;border:2px solid var(--line);margin-top:26px;padding:13px 14px}.searchbox input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:17px;font-weight:600;letter-spacing:-.01em;padding:0}.clear{border:0;background:transparent;cursor:pointer;font-size:18px;color:var(--muted2);padding:0 2px}.results{margin-top:10px}.result{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:15px 0;cursor:pointer;text-align:left}.result-name{font-size:17px;font-weight:700}.result-hint{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2)}.alert{border:2px solid var(--accent);padding:16px;margin-top:18px}.alert strong{font-size:14px;color:var(--accent)}.alert p{font-size:14px;line-height:1.45;color:var(--muted);margin:6px 0 0}.choice-list{display:flex;flex-direction:column;gap:12px;margin-top:24px}.choice{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;background:transparent;border:2px solid var(--line);padding:17px 16px;cursor:pointer;text-align:left}.choice-name{display:block;font-size:18px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase}.choice-city{display:block;font-size:13px;color:var(--muted);margin-top:4px}.info-card{border:2px solid var(--line);padding:18px 16px;margin-top:22px}.guest-name{font-size:20px;font-weight:800;text-transform:uppercase}.guest-city{font-size:13px;color:var(--muted);margin-top:4px}.inner-rule{height:1px;background:var(--line);margin:16px 0}.micro{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.extras{display:flex;flex-direction:column;gap:8px;margin-top:9px}.extra-row{display:flex;align-items:baseline;justify-content:space-between;gap:14px}.extra-label{font-size:16px;font-weight:700;text-transform:lowercase}.extra-amount{font-size:16px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}.none{font-size:15px;color:var(--muted);margin-top:9px}.help{text-align:center;padding:14px 4px 4px;font-size:12px;color:var(--muted)}
.wine-eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}.wine-title{font-size:44px;line-height:.96;letter-spacing:-.035em;font-weight:800;margin:0;text-transform:uppercase}.wine-copy{font-size:15px;line-height:1.5;color:var(--muted);margin:16px 0 0;max-width:34ch}.wine-list{display:flex;flex-direction:column;gap:12px;margin-top:26px}.wine-option{width:100%;display:flex;align-items:center;gap:14px;background:transparent;padding:18px 16px;cursor:pointer;text-align:left;border:2px solid var(--line)}.wine-option.selected{border-color:var(--accent)}.radio{width:18px;height:18px;border-radius:50%;flex:0 0 auto;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}.selected .radio{border-color:var(--accent)}.dot{width:8px;height:8px;border-radius:50%;background:transparent}.selected .dot{background:var(--accent)}.wine-option strong{display:block;font-size:17px;font-weight:800;text-transform:uppercase}
.damage-title{font-size:42px;line-height:.98;letter-spacing:-.035em;font-weight:800;margin:0;text-transform:uppercase}.damage-rule{height:2px;background:var(--ink);margin:18px 0 6px}.receipt-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}.receipt-row span:first-child{font-size:15px;font-weight:500;text-transform:lowercase}.receipt-row span:last-child{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}.receipt-total{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:22px 0 0}.receipt-total .label{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.receipt-total .amount{font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:.9;color:var(--accent);font-variant-numeric:tabular-nums}
.total-label{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.big-total{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:.92;color:var(--accent);font-variant-numeric:tabular-nums;margin-top:8px}.fx-grid{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;padding:20px 0}.fx-side{border-left:1px solid var(--line);padding-left:20px}.pay-heading{font-size:21px;font-weight:800;letter-spacing:-.02em;text-transform:uppercase;margin-top:28px}.pay-card{border:2px solid var(--line);padding:20px 16px;margin-top:12px}.pay-top{display:flex;align-items:center;justify-content:space-between;gap:16px}.pay-name{font-size:18px;font-weight:700;color:var(--accent)}.pay-handle{font-size:14px;font-weight:600;word-break:break-all;margin-top:5px}.copy{flex:0 0 auto;background:transparent;color:var(--accent);border:2px solid var(--accent);padding:11px 18px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}.instructions{height:1px;background:var(--line);margin:18px 0 14px}.instruction-copy{font-size:14px;font-weight:600;color:var(--muted);text-transform:lowercase}.instruction-copy strong{font-size:17px;font-weight:800;color:var(--accent)}.questions{font-size:14px;line-height:1.45;color:var(--muted);margin-top:16px;text-transform:uppercase}.questions strong{color:var(--accent)}
.done-screen{animation-duration:380ms}.check{width:72px;height:72px;border:2px solid var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:34px;font-weight:800}.done-title{font-size:44px;line-height:.98;letter-spacing:-.03em;font-weight:800;margin:24px 0 0}.done-copy{font-size:17px;color:var(--muted);margin:14px 0 0;max-width:30ch}.done-rule{height:1px;background:var(--line);margin:26px 0 16px}.done-total{text-align:center}.done-total-label{font-size:13px;font-weight:700;color:var(--muted)}.done-total-amount{font-size:32px;line-height:1;font-weight:800;letter-spacing:-.02em;color:var(--accent);margin-top:8px}@media(min-width:461px){.app{box-shadow:0 0 0 1px rgba(255,255,255,.04)}}
</style>
</head>
<body><div class="shell"><main class="app" id="app"></main></div>
<script>
const FOOD=47.50,WINE_SHARE=6.36,TIP_RATE=.05;const FX={CAD:1.61659,USD:1.1525};
const GUESTS=[{id:1,key:"Albert",name:"Albert H",city:"US",extras:[]},{id:2,key:"Brian",name:"Brian",city:"US",extras:[{label:"latte",amount:3.70}]},{id:3,key:"Christian",name:"Christian",city:"US",extras:[{label:"st. germain spritz",amount:12.50}]},{id:4,key:"David",name:"David",city:"US",extras:[{label:"pandan sour",amount:14.50}]},{id:5,key:"Galen",name:"Galen",city:"US",extras:[]},{id:6,key:"Jacoby",name:"Jacoby",city:"US",extras:[]},{id:7,key:"Joey",name:"Joey",city:"US",extras:[]},{id:8,key:"Mel",name:"Mel",city:"US",extras:[]},{id:9,key:"Nam",name:"Nam",city:"US",extras:[]},{id:10,key:"Phuc",name:"Phuc",city:"US",extras:[]},{id:11,key:"Powin",name:"Powin",city:"US",extras:[]},{id:12,key:"Ryan",name:"Ryan",city:"US",extras:[{label:"teh sosro",amount:4.50},{label:"jakarta blossom",amount:13.50}]},{id:13,key:"Tina",name:"Tina",city:"US",extras:[]},{id:14,key:"Tony",name:"Tony V",city:"US",extras:[]},{id:15,key:"Wesley",name:"Wesley",city:"US",extras:[]},{id:16,key:"Willy",name:"Willy",city:"US",extras:[]},{id:17,key:"Albert",name:"Albert C",city:"Vancouver",extras:[{label:"teh sosro",amount:4.50}]},{id:18,key:"Andrew",name:"Andrew",city:"Vancouver",extras:[]},{id:19,key:"Bruce",name:"Bruce",city:"Vancouver",extras:[{label:"pandan negroni",amount:14.50}]},{id:20,key:"Carson",name:"Carson",city:"Vancouver",extras:[]},{id:21,key:"Church",name:"Church",city:"Vancouver",extras:[]},{id:22,key:"Colin",name:"Colin",city:"Vancouver",extras:[{label:"cola zero",amount:3.50}]},{id:23,key:"Doug",name:"Douglas",city:"Vancouver",extras:[],aliases:["Douglas"]},{id:24,key:"Glenn",name:"Glenn",city:"Vancouver",extras:[]},{id:25,key:"Jerry",name:"Jerry",city:"Vancouver",extras:[]},{id:26,key:"Jeremiah",name:"Jeremiah",city:"Vancouver",extras:[{label:"banana collins",amount:14.00}]},{id:27,key:"Jordan",name:"Jordan",city:"Vancouver",extras:[]},{id:28,key:"Kevin",name:"Kevin",city:"Vancouver",extras:[]},{id:29,key:"Matthew",name:"Matthew",city:"Vancouver",extras:[{label:"ginger beer",amount:4.50}],aliases:["Matty"]},{id:30,key:"NJ",name:"NJ",city:"Vancouver",extras:[]},{id:31,key:"Ricky",name:"Ricky",city:"Vancouver",extras:[]},{id:32,key:"Solomon",name:"Solomon",city:"Vancouver",extras:[]},{id:33,key:"Stuart",name:"Stuart",city:"Vancouver",extras:[]},{id:34,key:"TC",name:"TC",city:"Vancouver",extras:[]},{id:35,key:"Tony",name:"Tony",city:"Vancouver",extras:[]}];
const PAY={Vancouver:{name:"Jerry",method:"E-TRANSFER",handle:"jjn.mejia@gmail.com",currency:"CAD",noteWord:"message"},US:{name:"Ricky",method:"VENMO",handle:"@viarc",currency:"USD",noteWord:"note"}};
const state={step:"welcome",query:"",dupeKey:null,guest:null,wine:null,copied:false};const app=document.getElementById("app");const eur=n=>"€"+n.toFixed(2);const money=(n,c)=>c==="CAD"?"C$"+n.toFixed(2):"US$"+n.toFixed(2);const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function totals(){if(!state.guest)return{lines:[],subtotal:0,tip:0,total:0};const lines=[{label:"set menu",amount:FOOD},...state.guest.extras.map(e=>({...e,label:e.label.toLowerCase()}))];if(state.wine===true)lines.push({label:"wine",amount:WINE_SHARE});const subtotal=lines.reduce((s,l)=>s+l.amount,0),tip=subtotal*TIP_RATE;return{lines,subtotal,tip,total:subtotal+tip}}
function progress(){if(state.step==="welcome")return"";const idx={name:1,pick:1,confirm:1,wine:2,receipt:3,transfer:4,done:4}[state.step]||0;const label={name:"1 of 4 · your name",pick:"1 of 4 · your name",confirm:"1 of 4 · your name",wine:"2 of 4 · wine",receipt:"3 of 4 · receipt",transfer:"4 of 4 · transfer",done:"settled"}[state.step]||"";return `<div class="progress"><div class="progress-row"><div class="progress-label">${label}</div><div class="brand">AMS LEO DINNER</div></div><div class="progress-track"><div class="progress-fill" style="width:${idx/4*100}%"></div></div></div>`}
function welcome(){return `<section class="screen welcome"><div class="eyebrow">AMS LEO DINNER</div><div class="rule"></div><h1>memories with friends:<br><span class="accent">priceless.</span></h1><h2>dinner:<br><span class="accent">unfortunately not.</span></h2><div class="spacer"></div><button class="primary" data-action="start"><span>let's go</span><span>→</span></button></section>`}
function uniqueKeys(){return [...new Set(GUESTS.map(g=>g.key))]}function searchGroups(){const q=state.query.trim().toLowerCase();if(!q)return[];return uniqueKeys().filter(key=>key.toLowerCase().startsWith(q)||GUESTS.some(g=>g.key===key&&(g.aliases||[]).some(a=>a.toLowerCase().startsWith(q)))).slice(0,7).map(key=>({key,group:GUESTS.filter(g=>g.key===key)}))}
function nameScreen(){const groups=searchGroups();return `<section class="screen"><h2 class="page-title">your name</h2><p class="subcopy">we'll find your share of the bill.</p><div class="searchbox"><span style="font-size:16px;color:var(--muted)">⌕</span><input id="nameInput" value="${esc(state.query)}" placeholder="type your first name" autocomplete="off" aria-label="First name">${state.query?'<button class="clear" data-action="clear" aria-label="Clear">×</button>':''}</div><div class="results">${groups.map(({key,group})=>`<button class="result" data-pick-key="${esc(key)}"><span class="result-name">${esc(group.length>1?key:group[0].name)}</span><span class="result-hint">${group.length>1?'2 people':esc(group[0].city)}</span></button>`).join('')}</div>${state.query&&groups.length===0?'<div class="alert"><strong>no match on the bill.</strong><p>check the spelling, or message Jerry or Ricky.</p></div>':''}<div class="spacer"></div><button class="back" data-action="back" aria-label="Back">←</button></section>`}
function pickScreen(){const dupes=GUESTS.filter(g=>g.key===state.dupeKey);return `<section class="screen"><h2 class="page-title">your name</h2><p class="subcopy">choose the one that matches you.</p><div class="choice-list">${dupes.map(g=>`<button class="choice" data-pick-id="${g.id}"><span><span class="choice-name">${esc(g.name)}</span><span class="choice-city">${esc(g.city)}</span></span><span class="accent" style="font-size:18px">→</span></button>`).join('')}</div><div class="spacer"></div><button class="back" data-action="back" aria-label="Back">←</button></section>`}
function confirmScreen(){const g=state.guest;return `<section class="screen"><h2 class="page-title">your name</h2><p class="subcopy">we'll find your share of the bill.</p><div class="info-card"><div class="guest-name">${esc(g.name)}</div><div class="guest-city">${esc(g.city)}</div><div class="inner-rule"></div><div class="micro">your add-on</div>${g.extras.length?`<div class="extras">${g.extras.map(e=>`<div class="extra-row"><span class="extra-label">${esc(e.label.toLowerCase())}</span><span class="extra-amount">${eur(e.amount)}</span></div>`).join('')}</div>`:'<div class="none">nothing extra recorded</div>'}</div><div class="help">something off? message Jerry or Ricky.</div><div class="spacer"></div><div class="bottom-row"><button class="back" data-action="back" aria-label="Back">←</button><button class="primary" data-action="toWine"><span>continue</span><span>→</span></button></div></section>`}
function wineScreen(){const yes=state.wine===true,no=state.wine===false;return `<section class="screen"><div class="wine-eyebrow">before we total it up</div><h2 class="wine-title">did you have<br>wine?</h2><p class="wine-copy">we couldn't reliably track wine by person, so please self-identify and choose the option that reflects what you had.</p><div class="wine-list"><button class="wine-option ${yes?'selected':''}" data-action="wineYes"><span class="radio"><span class="dot"></span></span><strong>yes, i had wine</strong></button><button class="wine-option ${no?'selected':''}" data-action="wineNo"><span class="radio"><span class="dot"></span></span><strong>no, i didn't</strong></button></div><div class="spacer"></div><div class="bottom-row"><button class="back" data-action="back" aria-label="Back">←</button><button class="primary" data-action="toReceipt" ${state.wine===null?'disabled':''} style="opacity:${state.wine===null?.35:1}"><span>show my receipt</span><span>→</span></button></div></section>`}
function receiptScreen(){const t=totals();return `<section class="screen"><h2 class="damage-title">the damage</h2><div class="damage-rule"></div>${t.lines.map(l=>`<div class="receipt-row"><span>${esc(l.label.toLowerCase())}</span><span>${eur(l.amount)}</span></div>`).join('')}<div class="receipt-row"><span>tip (5%)</span><span>${eur(t.tip)}</span></div><div class="receipt-total"><span class="label">total</span><span class="amount">${eur(t.total)}</span></div><div class="spacer"></div><div class="bottom-row"><button class="back" data-action="back" aria-label="Back">←</button><button class="primary" data-action="toTransfer"><span>next: how to settle</span><span>→</span></button></div></section>`}
function transferScreen(){const t=totals(),g=state.guest,p=PAY[g.city],amt=money(t.total*FX[p.currency],p.currency),pair=p.currency==="CAD"?"EUR/CAD":"EUR/USD",rate=p.currency==="CAD"?"1.61659":"1.1525",eqLabel=p.currency==="CAD"?"CAD EQUIVALENT":"USD EQUIVALENT",heading=p.currency==="CAD"?"E-TRANSFER JERRY":"VENMO RICKY";return `<section class="screen"><div class="total-label">your total</div><div class="big-total">${eur(t.total)}</div><div style="height:1px;background:var(--line);margin-top:30px"></div><div class="fx-grid"><div style="padding-right:18px"><div class="total-label">${eqLabel}</div><div style="font-size:36px;font-weight:800;letter-spacing:-.035em;margin-top:8px">${amt}</div></div><div class="fx-side"><div class="total-label">FX INFO</div><div style="font-size:17px;font-weight:600;margin-top:8px">${pair} ${rate}</div><div style="font-size:11px;line-height:1.45;color:var(--muted);margin-top:5px;text-transform:uppercase">JULY 30 · 18:45 CEST</div></div></div><div style="height:1px;background:var(--line)"></div><div class="pay-heading">${heading}</div><div class="pay-card"><div class="pay-top"><div><div class="pay-name">${esc(p.name)}</div><div class="pay-handle">${esc(p.handle)}</div></div><button class="copy" data-action="copy">${state.copied?'copied':'copy'}</button></div><div class="instructions"></div><div class="instruction-copy">put <strong>your name</strong> in the ${p.noteWord} field.</div></div><div class="questions">QUESTIONS? MESSAGE <strong>JERRY</strong> OR <strong>RICKY.</strong></div><div class="spacer"></div><div class="bottom-row"><button class="back" data-action="back" aria-label="Back">←</button><button class="primary" data-action="done"><span>i've sent it</span><span>→</span></button></div></section>`}
function doneScreen(){const t=totals();return `<section class="screen done-screen"><div class="spacer" style="min-height:20px"></div><div class="check">✓</div><h2 class="done-title">you're all set.</h2><p class="done-copy">thanks for settling up.</p><div class="done-rule"></div><div class="done-total"><div class="done-total-label">your total was</div><div class="done-total-amount">${eur(t.total)}</div></div><div class="spacer" style="min-height:24px"></div><button class="primary center" data-action="reset"><span>done</span></button></section>`}
function render(){let body="";if(state.step==="welcome")body=welcome();else if(state.step==="name")body=nameScreen();else if(state.step==="pick")body=pickScreen();else if(state.step==="confirm")body=confirmScreen();else if(state.step==="wine")body=wineScreen();else if(state.step==="receipt")body=receiptScreen();else if(state.step==="transfer")body=transferScreen();else body=doneScreen();app.innerHTML=progress()+body;if(state.step==="name"){const input=document.getElementById("nameInput");if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length)}}}
function back(){const prev={name:"welcome",pick:"name",confirm:"name",wine:"confirm",receipt:"wine",transfer:"receipt",done:"transfer"}[state.step]||"welcome";if(prev==="name"){state.step="name";state.guest=null}else state.step=prev;render()}
app.addEventListener("input",e=>{if(e.target.id==="nameInput"){state.query=e.target.value;render()}});app.addEventListener("click",async e=>{const key=e.target.closest("[data-pick-key]")?.dataset.pickKey;if(key){const group=GUESTS.filter(g=>g.key===key);if(group.length>1){state.dupeKey=key;state.step="pick"}else{state.guest=group[0];state.wine=null;state.step="confirm"}render();return}const id=e.target.closest("[data-pick-id]")?.dataset.pickId;if(id){state.guest=GUESTS.find(g=>g.id===Number(id));state.wine=null;state.step="confirm";render();return}const btn=e.target.closest("[data-action]");if(!btn)return;const a=btn.dataset.action;if(a==="start")state.step="name";else if(a==="clear")state.query="";else if(a==="back")return back();else if(a==="toWine")state.step="wine";else if(a==="wineYes")state.wine=true;else if(a==="wineNo")state.wine=false;else if(a==="toReceipt"&&state.wine!==null)state.step="receipt";else if(a==="toTransfer")state.step="transfer";else if(a==="done")state.step="done";else if(a==="reset"){Object.assign(state,{step:"welcome",query:"",dupeKey:null,guest:null,wine:null,copied:false})}else if(a==="copy"){try{await navigator.clipboard.writeText(PAY[state.guest.city].handle);state.copied=true;render();setTimeout(()=>{state.copied=false;render()},1600)}catch(_){state.copied=false}return}render()});render();
</script></body></html>
